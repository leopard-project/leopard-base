# Leopard 权限策略（启动期配置，内核只读取数据，不内置产品路径）
# 等级基础权限：all / none / 逗号分隔的 R,W,CS,NV,SV,SR,SW
grade.Root=all
grade.System=all
grade.Admin=all
grade.Visitor=R,W

# 内核拉起的进程（登录前）与 XAPI 访客启动使用的等级
launch.pre_login=Admin
launch.visitor=Visitor

# 路径类别
sys_dir=/system
settings_dir=/config
users_dir=/users

# 任意应用可读的公共目录（仍受写权限约束）
public_read=/etc
public_read=/system/resources

# 写入/删除需要 ChangeSettings
protected_write=/system/config
protected_write=/config
